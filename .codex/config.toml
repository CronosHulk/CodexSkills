# Project-scoped Codex configuration (trusted projects only).
# Main agent defaults to Luna; escalate to Sol explicitly for hard work.
model = "gpt-6-luna"
model_reasoning_effort = "medium"

[agents]
enabled = true
default_subagent_model = "gpt-6-luna"
default_subagent_reasoning_effort = "low"
max_concurrent_threads_per_session = 2

